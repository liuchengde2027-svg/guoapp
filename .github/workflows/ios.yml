name: Build iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      all_sources:
        description: '构建真果鉴（全部站源）；关闭则构建红果鉴'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Prepare CocoaPods
        run: |
          if ! command -v pod >/dev/null; then
            brew install cocoapods
          fi
      - name: Resolve project dependencies
        run: flutter pub get
      - name: Build unsigned IPA
        env:
          ALL_SOURCES: ${{ inputs.all_sources }}
        run: |
          if [ "$ALL_SOURCES" = "true" ]; then
            python3 scripts/build_ios.py --all-sources
          else
            python3 scripts/build_ios.py
          fi
          cp pubspec.lock dist/ios/pubspec.lock
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-${{ github.run_number }}
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14
